# Cross Crusade Cascade Locks 1 (2026-09-27). results.csv is transcribed from the published
# results PDF; waves are from crosscrusade.com/race-day-schedule.
# Each wave's gun is the schedule time. Lap times in results.csv are measured from the moment
# the wave was ARMED (after everyone rolled over the line), so every first lap is short.
#   arm_s:    seconds from the gun to arming (estimated from the first lap shortfall).
#   start_s:  each race's start after the gun. Races that went off later in the wave have a
#             smaller first-lap shortfall; estimated from that and rounded to 30 s. Correct freely.
#   finish_with_leader: false for a race that finishes on its own lap count, not the wave's.
event:
  name: "Cross Crusade Cascade Locks 1"
  date: "2026-09-27"
  location: "Cascade Locks, OR"
  timezone: "America/Los_Angeles"
  discipline: "cyclocross"
waves:
  - gun: "09:30"
    minutes: 25
    arm_s: 15
    races:
      - { name: "Unicycles", start_s: 0 }
      - { name: "Running Race", start_s: 0, finish_with_leader: false }
  - gun: "10:00"
    minutes: 45
    arm_s: 150
    races:
      - { name: "Masters 50+", start_s: 0 }
      - { name: "Masters 60+", start_s: 30 }
      - { name: "Clydesdale", start_s: 60 }
